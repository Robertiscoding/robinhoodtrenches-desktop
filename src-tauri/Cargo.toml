[package]
name = "robinhoodtrenches"
version = "1.0.0"
description = "robinhoodtrenches — live fomo.family trader tape"
authors = ["rob"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "robinhoodtrenches_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "zstd"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
open = "5"
rusqlite = { version = "0.40", features = ["bundled"] }

# release: whole-program optimisation, one codegen unit, no unwinding tables,
# symbols stripped. Slower to compile, faster and smaller to run.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1
